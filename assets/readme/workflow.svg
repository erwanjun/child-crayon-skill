<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Child Crayon workflow</title>
  <desc id="desc">A five-step workflow from reference photos to subject mapping, style lock, image generation and visual QA.</desc>
  <rect x="1" y="1" width="1198" height="248" rx="28" fill="#171717" stroke="#171717"/>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="42" y="46" font-size="17" font-weight="700" letter-spacing="2.5" fill="#c9c4bf">ONE PROMPT BECOMES A WORKFLOW</text>
  </g>
  <g transform="translate(42 76)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g>
      <rect width="190" height="126" rx="20" fill="#fffdfb"/>
      <text x="20" y="31" font-size="13" font-weight="800" fill="#8b8782" letter-spacing="1.5">01</text>
      <text x="20" y="62" font-size="20" font-weight="800" fill="#171717">INSPECT</text>
      <text x="20" y="87" font-size="14" fill="#68635f">all reference photos</text>
      <path d="M20 105 C58 96 96 112 144 102" fill="none" stroke="#f2a9b8" stroke-width="7" stroke-linecap="round"/>
    </g>
    <path d="M200 63 h28" stroke="#827e79" stroke-width="4" stroke-linecap="round"/>
    <path d="M222 56 l8 7 -8 7" fill="none" stroke="#827e79" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(238 0)">
      <rect width="190" height="126" rx="20" fill="#fffdfb"/>
      <text x="20" y="31" font-size="13" font-weight="800" fill="#8b8782" letter-spacing="1.5">02</text>
      <text x="20" y="62" font-size="20" font-weight="800" fill="#171717">SUBJECT MAP</text>
      <text x="20" y="87" font-size="14" fill="#68635f">each person, once</text>
      <circle cx="36" cy="105" r="6" fill="#9fb6d9"/>
      <circle cx="59" cy="105" r="6" fill="#e5c88e"/>
      <circle cx="82" cy="105" r="6" fill="#b9cfa8"/>
    </g>
    <path d="M438 63 h28" stroke="#827e79" stroke-width="4" stroke-linecap="round"/>
    <path d="M460 56 l8 7 -8 7" fill="none" stroke="#827e79" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(476 0)">
      <rect width="190" height="126" rx="20" fill="#fffdfb"/>
      <text x="20" y="31" font-size="13" font-weight="800" fill="#8b8782" letter-spacing="1.5">03</text>
      <text x="20" y="62" font-size="20" font-weight="800" fill="#171717">STYLE LOCK</text>
      <text x="20" y="87" font-size="14" fill="#68635f">CHILD_CRAYON_V1</text>
      <path d="M22 105 C55 96 91 111 126 101" fill="none" stroke="#171717" stroke-width="8" stroke-linecap="round"/>
      <path d="M24 111 C60 103 94 117 132 108" fill="none" stroke="#171717" stroke-width="3" stroke-linecap="round"/>
    </g>
    <path d="M676 63 h28" stroke="#827e79" stroke-width="4" stroke-linecap="round"/>
    <path d="M698 56 l8 7 -8 7" fill="none" stroke="#827e79" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(714 0)">
      <rect width="190" height="126" rx="20" fill="#fffdfb"/>
      <text x="20" y="31" font-size="13" font-weight="800" fill="#8b8782" letter-spacing="1.5">04</text>
      <text x="20" y="62" font-size="20" font-weight="800" fill="#171717">IMAGEGEN</text>
      <text x="20" y="87" font-size="14" fill="#68635f">one candidate / call</text>
      <rect x="20" y="99" width="60" height="12" rx="6" fill="#9fb6d9" opacity=".8"/>
      <rect x="86" y="99" width="38" height="12" rx="6" fill="#f2a9b8" opacity=".8"/>
    </g>
    <path d="M914 63 h28" stroke="#827e79" stroke-width="4" stroke-linecap="round"/>
    <path d="M936 56 l8 7 -8 7" fill="none" stroke="#827e79" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(952 0)">
      <rect width="190" height="126" rx="20" fill="#fffdfb"/>
      <text x="20" y="31" font-size="13" font-weight="800" fill="#8b8782" letter-spacing="1.5">05</text>
      <text x="20" y="62" font-size="20" font-weight="800" fill="#171717">VISUAL QA</text>
      <text x="20" y="87" font-size="14" fill="#68635f">reject critical drift</text>
      <path d="M22 105 l8 8 17-20" fill="none" stroke="#89a97f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
